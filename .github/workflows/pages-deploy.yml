name: Build and Deploy
on:
  push:
    branches: [main, master]
    paths-ignore: [.gitignore, README.md, LICENSE]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Build site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Build Markdown export
        # Download images during the build, avoiding browser CORS restrictions.
        # A failed export prevents replacing the last complete deployment.
        run: python tools/export_blog.py
      - name: Test Markdown export
        run: |
          python -B -m unittest discover -s tools/tests -p "test_*.py"
          bundle exec ruby tools/test_blog_export_input.rb
          bundle exec ruby tools/test_works_validation.rb
      - name: Check generated pages and local assets
        run: bundle exec ruby tools/check_site.rb
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
