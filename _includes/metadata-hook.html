<!-- Keep site customizations outside the theme's layouts. -->
{% if site.sakura.enabled %}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/{{ site.sakura.repository }}@{{ site.sakura.revision }}/dist/sakura.min.css">
{% endif %}
<template id="sakana-template">{% include sakana.html %}</template>
<script defer src="https://cdn.jsdelivr.net/gh/{{ site.sakana.repository }}@{{ site.sakana.revision }}/html/sakana.min.js"></script>
<script defer src="{{ '/assets/js/sakana/sakana_init.js' | relative_url }}"></script>
{% if site.sakura.enabled %}
<script defer src="https://cdn.jsdelivr.net/gh/{{ site.sakura.repository }}@{{ site.sakura.revision }}/dist/sakura.min.js"></script>
<script defer src="{{ '/assets/js/sakura/sakura_init.js' | relative_url }}"></script>
{% endif %}
{% if site.blog_export.enabled %}
<template id="blog-export-template">
  <span class="blog-export-row">
    <a href="{{ '/downloads/blog-markdown.zip' | relative_url }}"
       download="blog-markdown-{{ site.time | date: '%Y-%m-%d' }}.zip"
       title="下载全部文章 Markdown、文章图片、头像和背景（ZIP）"
       aria-label="导出全站：下载全部文章 Markdown 与图片（ZIP）">
      导出全站
    </a>
  </span>
</template>
<script defer src="{{ '/assets/js/blog-export.js' | relative_url }}"></script>
{% endif %}
